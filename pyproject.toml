[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rishikesh-urban-intelligence"
version = "1.0.0"
description = "Heat, greenery, amenity-access and priority-zone analysis for Rishikesh – with an interactive story dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy", "pandas", "geopandas>=0.14", "shapely>=2.0", "pyogrio", "scipy", "matplotlib", "folium", "branca",
  "osmnx>=1.9", "pystac-client", "planetary-computer", "odc-stac", "rioxarray", "rasterio", "affine", "xarray",
  "dask[array]", "mapclassify", "pyyaml", "flask>=3", "gunicorn",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rishikesh-urban = "rishikesh_urban.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rishikesh_urban = ["templates/*.html", "webtemplates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
